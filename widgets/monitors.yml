- type: monitor
  cache: 1m
  title: Services
  sites:
    - title: Proxmox
      url: ${PROXMOX_URL}
      icon: di:proxmox
      allow-insecure: true
    - title: PiHole
      url: ${PIHOLE_URL}/admin
      check-url: ${PIHOLE_URL}/admin
      icon: di:pi-hole
    - title: N8n
      url: ${N8N_URL}
      icon: di:n8n
    - title: Mealie
      url: ${MEALIE_URL}
      check-url: ${MEALIE_URL}/api/app/about
      icon: di:mealie
    - title: Portainer
      url: ${PORTAINER_URL}
      icon: di:docker
      allow-insecure: true

- type: monitor
  title: Cloud Services
  sites:
    - title: Tailscale
      url: ${TAILSCALE_URL}
      icon: di:tailscale
    - title: Github
      url: ${GITHUB_URL}
      icon: di:github
    - title: AWS
      url: ${AWS_CONSOLE_URL}
      icon: di:aws
    - title: Versel
      url: ${VERSEL_URL}
      icon: di:nextjs
