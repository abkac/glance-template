- type: monitor
  cache: 1m
  title: Services
  sites:
    - title: Proxmox
      url: ${PROXMOX_URL}
      icon: di:proxmox
      # allow-insecure: true
    - title: Karakeep
      url: ${KAREKEEP_URL}
      icon: di:karakeep
    - title: Home Assistant
      url: ${HOME_ASSISTANT_URL}
      icon: di:home-assistant
    - title: Zigbee2MQTT
      url: ${ZIGBEE2MQTT_URL}
      icon: di:zigbee2mqtt
    - title: Keycloak
      url: ${KEYCLOAK_URL}
      icon: di:keycloak
    - title: PiHole
      url: ${PIHOLE_URL}/admin
      check-url: ${PIHOLE_URL}/admin
      icon: di:pi-hole
    - title: Portainer
      url: ${PORTAINER_URL}
      icon: di:docker
      allow-insecure: true
    - title: N8n
      url: ${N8N_URL}
      icon: di:n8n
    - title: Mealie
      url: ${MEALIE_URL}
      check-url: ${MEALIE_URL}/api/app/about
      icon: di:mealie
    - title: Audiobookshelf
      url: ${AUDIOBOOKSHELF_URL}
      icon: di:audiobookshelf
    - title: InfluxDB
      url: ${INFLUXDB_URL}
      icon: di:influxdb

