- type: monitor
  cache: 1m
  title: Services
  sites:
    - title: Proxmox
      url: ${PROXMOX_URL}
      check-url: https://pve.${LAN_DOMAIN}
      icon: di:proxmox
      # allow-insecure: true
    - title: Karakeep
      url: ${KAREKEEP_URL}
      check-url: https://karakeep.${LAN_DOMAIN}
      icon: di:karakeep
    - title: Home Assistant
      url: ${HOME_ASSISTANT_URL}
      check-url: ${HOME_ASSISTANT_LAN_URL}
      icon: di:home-assistant
    - title: Zigbee2MQTT
      url: ${ZIGBEE2MQTT_URL}
      check-url: https://zigbee.${LAN_DOMAIN}
      icon: di:zigbee2mqtt
    - title: Keycloak
      url: ${KEYCLOAK_URL}
      check-url: https://keycloak.${LAN_DOMAIN}
      icon: di:keycloak
    - title: PiHole
      url: ${PIHOLE_URL}/admin
      check-url: ${PIHOLE_URL}/admin
      icon: di:pi-hole
    - title: Portainer
      url: ${PORTAINER_URL}
      check-url: https://portainer.${LAN_DOMAIN}
      icon: di:docker
      allow-insecure: true
    - title: N8n
      url: ${N8N_URL}
      check-url: https://n8n.${LAN_DOMAIN}
      icon: di:n8n
    - title: Mealie
      url: ${MEALIE_URL}
      check-url: ${MEALIE_URL}/api/app/about
      icon: di:mealie
    - title: Audiobookshelf
      url: ${AUDIOBOOKSHELF_URL}
      check-url: https://audiobook.${LAN_DOMAIN}
      icon: di:audiobookshelf
    - title: InfluxDB
      url: ${INFLUXDB_URL}
      check-url: https://influxdb.${LAN_DOMAIN}
      icon: di:influxdb
    - title: Nginx Proxy Manager
      url: ${NGINX_PROXY_MANAGER_URL}
      check-url: https://npm.${LAN_DOMAIN}
      icon: di:nginx-proxy-manager

